<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snow</title>
    <link href="./demo.css" rel="stylesheet" />
    <script type="module" src="./demo.js"></script>
  </head>
  <body>
    <h1>Let it snow!</h1>
    <snow-fall flake-color="white"></snow-fall>
    <div id="controls">
      <div class="control">
        <label for="flakeSize">flake size</label>
        <input type="number" min="0" step="1" id="flakeSize" />
      </div>
      <div class="control">
        <label for="flakeSizeDeviation">size deviation</label>
        <input type="number" min="0" step="1" id="flakeSizeDeviation" />
      </div>
      <div class="control">
        <label for="flakeColor">flake color</label>
        <input type="text" id="flakeColor" value="white" />
      </div>
      <div class="control">
        <label for="flakeSpeed">flake speed</label>
        <input type="number" min="0" step="1" id="flakeSpeed" />
      </div>
      <div class="control">
        <label for="flakeSpeedDeviation">speed deviation</label>
        <input type="number" min="0" step="1" id="flakeSpeedDeviation" />
      </div>
      <div class="control">
        <label for="flakeDirection">flake direction</label>
        <input type="number" min="-360" step="1" max="360" id="flakeDirection" />
      </div>
      <div class="control">
        <label for="flakeDirectionDeviation">direction deviation</label>
        <input type="number" min="0" step="5" max="180" id="flakeDirectionDeviation" />
      </div>
      <div class="control">
        <label for="density" title="Snowflakes per 1,000 × 1,000 CSS pixels">density</label>
        <input type="number" min="0" step="1" id="density" />
      </div>
      <div class="control">
        <input type="checkbox" id="fillMode" />
        <label for="fillMode">fill instantly</label>
      </div>
      <div class="control">
        <input type="checkbox" id="showFps" />
        <label for="showFps">show FPS</label>
      </div>
      <div class="control">
        <input type="checkbox" id="paused" />
        <label for="paused">paused</label>
      </div>
      <div class="control">
        <button type="button" class="close-button">hide</button>
      </div>
    </div>
    <a class="github-link" href="https://github.com/QuentinRoy/snow">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path
          d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.24c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.1.81 2.22v3.3c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"
        />
      </svg>
      GitHub
    </a>
  </body>
</html>
